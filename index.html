<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Atlas — training, recovery and nutrition tracking for personal trainers and their clients." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Atlas Coach</title>
    <style>
      html, body { background: #000000; color: #ffffff; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f2f7; color: #000000; }
    </style>
    <script>
      // Apply saved display settings before first paint (mirrors src/lib/display.ts).
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem('atlas.display') || '{}') || {}; } catch (e) {}
        var t = p.theme || 'dark';
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        if (p.textScale) r.style.setProperty('--ts', String(p.textScale));
        if (p.boldText) r.style.setProperty('--wb', '150');
        if (p.reduceTransparency) r.setAttribute('data-solid', '');
        if (p.glass === false) r.setAttribute('data-glass', 'off');
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f2f7');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
